plugins {
    id 'com.android.application'
}

android {
    namespace 'nz.ac.waikato.campuslife'
    compileSdk 35

    defaultConfig {
        applicationId "nz.ac.waikato.campuslife"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aligns the Kotlin standard library artifacts that AppCompat pulls in,
    // so the build does not fail with duplicate kotlin.* classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
